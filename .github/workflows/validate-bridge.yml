name: Validate bridge and web files

on:
  push:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse PowerShell files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            'bridge/server.ps1',
            'bridge/create-sigmanest-ws.ps1',
            'bridge/dxf-indexer.ps1',
            'bridge/update-and-start.ps1',
            'tests/test-dxf-indexer.ps1'
          )
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file)) {
              throw "Missing required PowerShell file: $file"
            }
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Host "$file has PowerShell parse errors:" -ForegroundColor Red
              $errors | ForEach-Object {
                Write-Host ("Line "+$_.Extent.StartLineNumber+", Col "+$_.Extent.StartColumnNumber+": "+$_.Message) -ForegroundColor Red
              }
              exit 1
            }
            Write-Host "$file syntax: OK" -ForegroundColor Green
          }

      - name: Validate web files
        shell: bash
        run: |
          set -euo pipefail
          node --check taskpane.js
          node --check src/clParser.js
          echo "JavaScript syntax: OK"

      - name: Validate CL parser behaviour
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          global.window={};
          eval(fs.readFileSync('src/clParser.js','utf8'));
          const p=window.CLParser.parseSheet([
            ['Part','Qty','Material','Thickness'],
            ['TEST-001',3,'S355','6mm']
          ],{sheet:'BAT TEST (x2)'})[0];
          if(!p) throw new Error('Parser returned no row');
          if(p.baseQty!==3 || p.batchMultiplier!==2 || p.qty!==6) {
            throw new Error('Batch multiplier logic failed: '+JSON.stringify(p));
          }
          console.log('CL parser behaviour: OK');
          NODE

      - name: Validate DXF indexer end-to-end
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & (Join-Path $PWD 'tests/test-dxf-indexer.ps1')

      - name: Validate manifest XML
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $xml = [xml](Get-Content -Raw -LiteralPath 'manifest.xml')
          if (-not $xml.OfficeApp) { throw 'manifest.xml did not parse as an OfficeApp manifest.' }
          $source = [string]$xml.OfficeApp.DefaultSettings.SourceLocation.DefaultValue
          if ($source -notmatch '^https://eithanbat.github.io/CL---WS-Creator/taskpane.html') {
            throw "manifest.xml SourceLocation is unexpected: $source"
          }
          if ([string]$xml.OfficeApp.Hosts.Host.Name -ne 'Workbook') {
            throw 'Manifest does not target Excel Workbook.'
          }
          $version=[string]$xml.OfficeApp.Version
          if($version -notmatch '^d+.d+.d+.d+$'){throw "Invalid manifest version: $version"}
          Write-Host "manifest.xml: OK (version $version)" -ForegroundColor Green

      - name: Validate architecture and launcher
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $server = Get-Content -Raw -LiteralPath 'bridge/server.ps1'
          $indexer = Get-Content -Raw -LiteralPath 'bridge/dxf-indexer.ps1'
          $updater = Get-Content -Raw -LiteralPath 'bridge/update-and-start.ps1'
          $taskpane = Get-Content -Raw -LiteralPath 'taskpane.js'
          $html = Get-Content -Raw -LiteralPath 'taskpane.html'
          $bat = Get-Content -Raw -LiteralPath 'Start Bridge Fixed.bat'
          $tracked = @(git ls-files)

          if($tracked -notcontains 'bridge/create-sigmanest-ws.ps1'){throw 'Repository tree is missing bridge/create-sigmanest-ws.ps1.'}
          if($tracked -contains 'create-sigmanest-ws.ps1' -or $tracked -contains 'server.ps1' -or $tracked -contains 'dxf-indexer.ps1' -or $tracked -contains 'update-and-start.ps1'){
            throw 'Repository tree contains a stray root-level bridge runtime file.'
          }

          if ($server -notmatch 'function Start-DxfScan') { throw 'Server does not contain Start-DxfScan.' }
          if ($server -notmatch 'function Get-DxfShardCandidates') { throw 'Server does not contain the sharded DXF index reader.' }
          if ($server -match 'Get-ChildItem[^
]*$dxfRoot[^
]*-Recurse') { throw 'Server must never recursively enumerate the DXF root during an HTTP request.' }
          if ($server -match 'Get-GeometryFiless+-roots+$dxfRoot') { throw 'Server must not use the synchronous DXF walk.' }
          if ($server -notmatch 'DXF_INDEX_NOT_READY') { throw 'Server build API does not reject incomplete DXF indexes.' }
          if ($server -notmatch 'FOUND - DXF') { throw 'Server does not have the DXF-ready status path.' }

          $serverLine=@($server -split "?
" | Where-Object {$_ -match '^s*$BRIDGE_VERSIONs*='}) | Select-Object -First 1
          $bridgeVersion=[regex]::Match($serverLine,"'([^']+)'").Groups[1].Value
          if($bridgeVersion -notmatch '^d+.d+.d+$'){throw "Invalid bridge runtime version: $bridgeVersion"}

          if ($indexer -notmatch '[IO.Directory]::EnumerateFiles') { throw 'DXF indexer is not using the streaming directory enumerator.' }
          if ($indexer -notmatch 'RequestFile') { throw 'DXF indexer does not support request-file startup.' }
          if ($indexer -notmatch 'ReparsePoint') { throw 'DXF indexer does not protect against reparse-point recursion.' }

          $indexerLine=@($indexer -split "?
" | Where-Object {$_ -match '^s*$DXF_INDEXER_VERSIONs*='}) | Select-Object -First 1
          $indexerVersion=[regex]::Match($indexerLine,"'([^']+)'").Groups[1].Value
          $requiredLine=@($server -split "?
" | Where-Object {$_ -match '^s*$requiredIndexerVersions*='}) | Select-Object -First 1
          $requiredVersion=[regex]::Match($requiredLine,"'([^']+)'").Groups[1].Value
          if([string]::IsNullOrWhiteSpace($indexerVersion) -or [string]::IsNullOrWhiteSpace($requiredVersion)){throw 'Could not read DXF indexer version declarations.'}
          if($indexerVersion -ne $requiredVersion){throw "Server requires DXF indexer $requiredVersion but indexer publishes $indexerVersion."}

          if ($updater -notmatch 'function Get-GitBlobSha1') { throw 'Updater is missing Git blob integrity validation.' }
          if ($updater -notmatch 'function Test-Syntax') { throw 'Updater is missing PowerShell syntax validation.' }
          if ($updater -notmatch '$newFiles') { throw 'Updater rollback does not track newly created runtime files.' }
          if ($updater -notmatch 'dxf-index\.json' -or $updater -notmatch 'dxf-index-status\.json') { throw 'Updater does not preserve generated DXF index state.' }
          if ($updater -notmatch 'bridge/*') { throw 'Updater does not discover all bridge files from GitHub.' }

          if ($bat -notmatch 'raw.githubusercontent.com/eithanbat-bot/CL---WS-Creator/main/bridge/update-and-start.ps1') { throw 'Bootstrap launcher does not point to the GitHub self-updater.' }
          if ($bat -notmatch 'Git blob integrity validation') { throw 'Bootstrap launcher does not verify updater integrity.' }
          if ($taskpane -notmatch 'Start Bridge Fixed.bat') { throw 'Task pane does not reference the stable bridge launcher.' }
          if ($html -notmatch 'taskpane.js?v=__BUILD__') { throw 'Task pane cache-busting placeholder is missing.' }

          Write-Host ("Architecture checks: OK. Bridge $bridgeVersion / DXF indexer $indexerVersion") -ForegroundColor Green
