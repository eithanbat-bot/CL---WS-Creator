name: Validate bridge scripts

on:
  push:
  workflow_dispatch:

jobs:
  validate-powershell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse bridge scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            'bridge/server.ps1',
            'bridge/create-sigmanest-ws.ps1'
          )

          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null

            if ($errors.Count -gt 0) {
              Write-Host "$file has PowerShell parse errors:" -ForegroundColor Red
              $errors | ForEach-Object { Write-Host $_.Message -ForegroundColor Red }
              exit 1
            }

            Write-Host "$file syntax: OK" -ForegroundColor Green
          }


      - name: Validate web files
        shell: bash
        run: |
          set -e
          node --check taskpane.js
          node --check src/clParser.js
          echo "JavaScript syntax: OK"

      - name: Validate manifest XML
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $xml = [xml](Get-Content -Raw -LiteralPath 'manifest.xml')
          if (-not $xml.OfficeApp) {
            throw 'manifest.xml did not parse as an OfficeApp manifest.'
          }
          Write-Host 'manifest.xml: OK' -ForegroundColor Green

      - name: Check known build-path hazards
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $server = Get-Content -Raw -LiteralPath 'bridge/server.ps1'
          $creator = Get-Content -Raw -LiteralPath 'bridge/create-sigmanest-ws.ps1'
          $bat = Get-Content -Raw -LiteralPath 'start-bridge.bat'

          if ($server -match "Join-Path\s+\$out\s+'parts'\s+\(\[IO\.Path\]::GetFileName\(\$p\.file\)\)") {
            throw 'Unsafe three-argument Join-Path remains in Write-Job.'
          }

          if ($creator -match '(?m)^\s*.*AddfromLibrary\s*\(' -and $creator -notmatch '(?m)^\s*#') {
            throw 'Executable AddfromLibrary call remains in the SigmaNEST creator.'
          }

          foreach ($needle in @(
            "%~dp0bridge\server.ps1",
            "%~dp0bridge\create-sigmanest-ws.ps1"
          )) {
            if ($bat -notlike "*$needle*") {
              throw "start-bridge.bat is missing expected path: $needle"
            }
          }

          if ($bat -notlike '*Parser]::ParseFile*') {
            throw 'start-bridge.bat is missing the local syntax preflight.'
          }

          if ($server -notmatch "Get-ChildItem -LiteralPath \$root -Recurse -File") {
            throw 'Server scan is not recursive.'
          }

          if ($server -notmatch "Extension -ieq '\.prs' -or \$_.Extension -ieq '\.dxf'") {
            throw 'Server scan is not indexing both PRS and DXF files.'
          }

          if ($server -notmatch "FOUND - DXF") {
            throw 'Server build path is missing DXF-ready status handling.'
          }

          if ($creator -notmatch "sourceType") {
            throw 'SigmaNEST creator does not receive sourceType.'
          }

          Write-Host 'Build-path hazard checks: OK' -ForegroundColor Green
