name: Validate bridge and web files

on:
  push:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse PowerShell files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            'bridge/server.ps1',
            'bridge/sigmanest-com.ps1',
            'bridge/build-worker.ps1',
            'bridge/create-sigmanest-ws.ps1',
            'bridge/dxf-indexer.ps1',
            'bridge/update-and-start.ps1',
            'tests/test-dxf-indexer.ps1'
          )
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file)) {
              throw "Missing required PowerShell file: $file"
            }
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Host "$file has PowerShell parse errors:" -ForegroundColor Red
              foreach($err in $errors){
                Write-Host ("Line "+$err.Extent.StartLineNumber+", Col "+$err.Extent.StartColumnNumber+": "+$err.Message) -ForegroundColor Red
              }
              exit 1
            }
            Write-Host "$file syntax: OK" -ForegroundColor Green
          }

      - name: Validate web files
        shell: bash
        run: |
          set -euo pipefail
          node --check taskpane.js
          node --check src/clParser.js
          echo "JavaScript syntax: OK"

      - name: Validate CL parser behaviour
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          global.window={};
          eval(fs.readFileSync('src/clParser.js','utf8'));
          const p=window.CLParser.parseSheet([
            ['Part','Qty','Material','Thickness'],
            ['TEST-001',3,'S355','6mm']
          ],{sheet:'BAT TEST (x2)'})[0];
          if(!p) throw new Error('Parser returned no row');
          if(p.baseQty!==3 || p.batchMultiplier!==2 || p.qty!==3 || p.effectiveQty!==6) {
            throw new Error('Per-vehicle quantity / task batch logic failed: '+JSON.stringify(p));
          }
          console.log('CL parser behaviour: OK');
          NODE

      - name: Validate DXF indexer end-to-end
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & (Join-Path $PWD 'tests/test-dxf-indexer.ps1')

      - name: Validate manifest XML
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifestText=Get-Content -Raw -LiteralPath 'manifest.xml'
          $xml=[xml]$manifestText
          if(-not $xml.DocumentElement){throw 'manifest.xml did not parse as XML.'}
          if(-not $manifestText.Contains('https://eithanbat-bot.github.io/CL---WS-Creator/taskpane.html')){throw 'manifest.xml does not contain the GitHub Pages task pane URL.'}
          if(-not $manifestText.Contains('<Host Name="Workbook"/>')){throw 'Manifest does not target Excel Workbook.'}
          if(-not $manifestText.Contains('<Permissions>ReadWriteDocument</Permissions>')){throw 'Manifest permissions are missing.'}
          Write-Host 'manifest.xml: OK' -ForegroundColor Green

      - name: Validate architecture and launcher
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $server = Get-Content -Raw -LiteralPath 'bridge/server.ps1'
          $indexer = Get-Content -Raw -LiteralPath 'bridge/dxf-indexer.ps1'
          $updater = Get-Content -Raw -LiteralPath 'bridge/update-and-start.ps1'
          $taskpane = Get-Content -Raw -LiteralPath 'taskpane.js'
          $html = Get-Content -Raw -LiteralPath 'taskpane.html'
          $bat = Get-Content -Raw -LiteralPath 'Start Bridge Fixed.bat'
          $tracked = @(git ls-files)

          if($tracked -notcontains 'bridge/create-sigmanest-ws.ps1'){throw 'Repository tree is missing bridge/create-sigmanest-ws.ps1.'}
          $com = Get-Content -Raw -LiteralPath 'bridge/sigmanest-com.ps1'
          if($tracked -contains 'create-sigmanest-ws.ps1' -or $tracked -contains 'server.ps1' -or $tracked -contains 'dxf-indexer.ps1' -or $tracked -contains 'update-and-start.ps1'){
            throw 'Repository tree contains a stray root-level bridge runtime file.'
          }

          if(-not $server.Contains('function Start-DxfScan')){throw 'Server does not contain Start-DxfScan.'}
          if(-not $server.Contains('function Get-DxfShardCandidates')){throw 'Server does not contain the sharded DXF index reader.'}
          if(-not $server.Contains('function Invoke-DxfScheduler')){throw 'Server does not contain the nightly DXF scheduler.'}
          if(-not $server.Contains('function Get-DxfWorkerCount')){throw 'Server does not contain DXF worker-count configuration.'}
          if(-not $server.Contains('AcceptTcpClientAsync')){throw 'Bridge listener is not scheduler-friendly.'}
          if(-not $server.Contains('/api/dxf-refresh')){throw 'DXF refresh API endpoint is missing.'}
          if($server.Contains('Get-GeometryFiles -root $dxfRoot')){throw 'Server must not use the synchronous DXF walk.'}
          if(-not $server.Contains('deliberately prefer DXF')){throw 'Server does not contain the DXF-first geometry selection rule.'}
          if(-not $server.Contains('$pool=if($dxf.Count -gt 0){$dxf}')){throw 'Server does not prefer DXF when a DXF candidate exists.'}
          if(-not $server.Contains('DXF_INDEX_NOT_READY')){throw 'Server build API does not reject incomplete DXF indexes.'}
          if(-not $server.Contains('FOUND - DXF')){throw 'Server does not have the DXF-ready status path.'}
          if(-not $com.Contains('function Invoke-SigmaNestImportGeometry')){throw 'SigmaNEST COM runtime is missing the geometry import entry point.'}
          if(-not $com.Contains('SN-Set-TaskMaterialAndThickness')){throw 'SigmaNEST COM runtime does not apply CL material/thickness to task records.'}
          if(-not $com.Contains('SN-Set-TaskPartQuantity')){throw 'SigmaNEST COM runtime does not apply CL quantity to task records.'}

          $serverLine=@($server -split [Environment]::NewLine | Where-Object {$_.TrimStart().StartsWith('$BRIDGE_VERSION')}) | Select-Object -First 1
          $bridgeVersion=[regex]::Match($serverLine,"'([^']+)'").Groups[1].Value
          if([string]::IsNullOrWhiteSpace($bridgeVersion)){throw 'Bridge runtime version is not declared.'}

          if(-not $indexer.Contains('[IO.Directory]::EnumerateFiles')){throw 'DXF indexer is not using the streaming directory enumerator.'}
          if(-not $indexer.Contains('RequestFile')){throw 'DXF indexer does not support request-file startup.'}
          if(-not $indexer.Contains("$DXF_INDEXER_VERSION = '3.0.1'")){throw 'DXF indexer version is not 3.0.1.'}
          if(-not $indexer.Contains('WorkerBuckets') -and -not $indexer.Contains('controlled parallel workers')){throw 'DXF indexer does not contain the parallel-worker controller.'}
          if(-not $indexer.Contains('ReparsePoint')){throw 'DXF indexer does not protect against reparse-point recursion.'}

          $indexerLine=@($indexer -split [Environment]::NewLine | Where-Object {$_.TrimStart().StartsWith('$DXF_INDEXER_VERSION')}) | Select-Object -First 1
          $indexerVersion=[regex]::Match($indexerLine,"'([^']+)'").Groups[1].Value
          $requiredLine=@($server -split [Environment]::NewLine | Where-Object {$_.TrimStart().StartsWith('$requiredIndexerVersion')}) | Select-Object -First 1
          $requiredVersion=[regex]::Match($requiredLine,"'([^']+)'").Groups[1].Value
          if([string]::IsNullOrWhiteSpace($indexerVersion) -or [string]::IsNullOrWhiteSpace($requiredVersion)){throw 'Could not read DXF indexer version declarations.'}
          if($indexerVersion -ne $requiredVersion){throw "Server requires DXF indexer $requiredVersion but indexer publishes $indexerVersion."}

          if(-not $updater.Contains('function Test-Syntax')){throw 'Updater is missing PowerShell syntax validation.'}
          if(-not $updater.Contains('$newFiles')){throw 'Updater rollback does not track newly created runtime files.'}
          if(-not $updater.Contains('dxf-index.json') -or -not $updater.Contains('dxf-index-status.json')){throw 'Updater does not preserve generated DXF index state.'}
          if(-not $updater.Contains('https://github.com/$Repo/archive/refs/heads/$Branch.zip')){throw 'Updater does not use the single GitHub repository archive.'}
          if(-not $updater.Contains('Expand-Archive')){throw 'Updater does not extract the repository archive.'}
          if($updater.Contains('$ApiContents=')){throw 'Updater still contains the old per-file GitHub Contents API dependency.'}

          if(-not $bat.Contains('raw.githubusercontent.com/eithanbat-bot/CL---WS-Creator/main/bridge/update-and-start.ps1')){throw 'Bootstrap launcher does not point to the raw GitHub self-updater.'}
          if(-not $taskpane.Contains('Start Bridge Fixed.bat')){throw 'Task pane does not reference the stable bridge launcher.'}
          if(-not $com.Contains('CreateTasksListForNewPartsInWS')){throw 'SigmaNEST COM import path does not create task records.'}
          if(-not $com.Contains("'BatchQty','BatchQuantity'")){throw 'SigmaNEST COM runtime does not prioritize BatchQty for quantity.'}
          if(-not $taskpane.Contains("$('refreshDxf')")){throw 'Task pane does not wire the DXF refresh control.'}
          if(-not $html.Contains('taskpane.js?v=__BUILD__')){throw 'Task pane cache-busting placeholder is missing.'}
          if(-not $html.Contains('id="refreshDxf"')){throw 'Task pane HTML is missing the DXF refresh button.'}
          if(-not (Get-Content -Raw -LiteralPath 'bridge/create-sigmanest-ws.ps1').Contains('$RequestFile,[string]$ResultFile')){throw 'SigmaNEST creator parameters are missing.'}

          if($bridgeVersion -ne '2.13.2'){throw "Unexpected bridge runtime version: $bridgeVersion"}
          Write-Host ("Architecture checks: OK. Bridge "+$bridgeVersion+" / DXF indexer "+$indexerVersion) -ForegroundColor Green
