name: Deploy Excel add-in to GitHub Pages
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Stamp build id for cache-busting
        shell: bash
        run: |
          sed -i "s/__BUILD__/${GITHUB_SHA::8}/g" taskpane.html
          sed -i "s/__BUILD__/${GITHUB_SHA::8}/g" manifest.xml
      - name: Package bridge
        shell: bash
        run: |
          rm -rf bridge-package
          mkdir -p bridge-package/bridge
          cp "Start Bridge Fixed.bat" bridge-package/
          cp "manifest.xml" bridge-package/
          cp bridge/server.ps1 bridge-package/bridge/
          cp bridge/dxf-indexer.ps1 bridge-package/bridge/
          cp bridge/create-sigmanest-ws.ps1 bridge-package/bridge/
          cp bridge/update-and-start.ps1 bridge-package/bridge/
          (cd bridge-package && zip -r "../CL-WS-Creator-Bridge-${GITHUB_SHA::8}.zip" .)
      - name: Upload bridge package
        uses: actions/upload-artifact@v4
        with:
          name: CL-WS-Creator-Bridge-${{ github.sha }}
          path: CL-WS-Creator-Bridge-${{ github.sha }}.zip
          retention-days: 14
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
